{% extends "base.html" %}
{% block content %}

<style>
    .auth-container {
        max-width: 440px;
        margin: 60px auto;
    }
    
    .auth-card {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 40px;
    }
    
    .auth-title {
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 32px;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .auth-card label {
        color: var(--text-secondary);
        font-weight: 500;
        margin-bottom: 8px;
        display: block;
    }
    
    .auth-card input[type="text"],
    .auth-card input[type="password"],
    .auth-card input[type="email"] {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 20px;
        background: var(--bg-card);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .auth-card input:focus {
        outline: none;
        border-color: var(--accent-cyan);
        box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.15);
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 24px;
        color: var(--text-secondary);
    }
    
    .auth-footer a {
        color: var(--accent-cyan);
        font-weight: 500;
    }
    
    /* Password Toggle Styles */
    .password-wrapper {
        position: relative;
    }
    
    .password-wrapper input {
        padding-right: 50px !important;
    }
    
    .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        font-size: 1.1rem;
        transition: color 0.2s ease;
        margin-top: -10px;
    }
    
    .password-toggle:hover {
        color: var(--accent-cyan);
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title"><i class="bi bi-box-arrow-in-right me-2"></i>Login to Your Account</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <p>
                    {{ field.label_tag }}
                    {% if 'password' in field.name %}
                        <span class="password-wrapper">
                            {{ field }}
                            <button type="button" class="password-toggle" onclick="togglePassword(this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </span>
                    {% else %}
                        {{ field }}
                    {% endif %}
                </p>
            {% endfor %}
            
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-neon w-100 py-3 mt-3">
                <i class="bi bi-unlock me-2"></i>Login
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>.
        </p>
    </div>
</div>

<script>
function togglePassword(button) {
    const wrapper = button.parentElement;
    const input = wrapper.querySelector('input');
    const icon = button.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>

{% endblock %}
